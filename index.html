<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Moe Girls Racing</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=Barlow:wght@300;400;500;600&family=Teko:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Reset & base ── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0A1628;       /* deep navy */
  --ink2:#15263D;
  --ink3:#1E3352;
  --paper:#F5F3EE;     /* warm off-white */
  --paper2:#EDE9E0;
  --rule:#D4CFC4;
  --rule2:#C5BFB2;
  --blue:#1A5FAB;
  --blue-lt:#2E7FD4;
  --blue-dim:rgba(26,95,171,0.12);
  --red:#C0392B;
  --red-lt:#E74C3C;
  --red-dim:rgba(192,57,43,0.10);
  --gold:#B8860B;
  --gold-lt:#D4A017;
  --gold-dim:rgba(184,134,11,0.12);
  --green:#1A7A4A;
  --green-dim:rgba(26,122,74,0.12);
  --muted:#7A7268;
  --muted2:#9A9388;
  --goal-band:rgba(26,122,74,0.08);
}

html{scroll-behavior:smooth}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Barlow',sans-serif;
  font-size:16px;
  font-weight:400;
  line-height:1.55;
  overflow-x:hidden;
}

/* ── Typography ── */
.teko{font-family:'Teko',sans-serif}
.bc{font-family:'Barlow Condensed',sans-serif}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:-.02em}

/* ── Page wrapper ── */
.site{min-height:100vh;display:flex;flex-direction:column}

/* ── Masthead ── */
.masthead{
  background:var(--ink);
  color:var(--paper);
  padding:0 40px;
  display:flex;align-items:stretch;
  border-bottom:3px solid var(--gold);
  position:sticky;top:0;z-index:200;
}
.mast-brand{
  display:flex;align-items:center;gap:14px;
  padding:14px 0;
  border-right:1px solid rgba(255,255,255,0.1);
  padding-right:28px;margin-right:28px;
}
.mast-logo{
  width:38px;height:38px;border-radius:50%;
  background:var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:'Teko',sans-serif;font-size:18px;font-weight:600;
  color:var(--ink);letter-spacing:.02em;flex-shrink:0;
}
.mast-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:17px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;line-height:1.1;
}
.mast-title small{
  display:block;font-size:10px;font-weight:400;
  letter-spacing:.15em;color:rgba(255,255,255,0.45);
  text-transform:uppercase;margin-top:1px;
}

/* Sailor tabs in masthead */
.sailor-tabs{display:flex;gap:4px;align-items:center;flex:1}
.sailor-tab{
  display:flex;align-items:center;gap:8px;
  padding:8px 18px;border-radius:4px 4px 0 0;
  font-family:'Barlow Condensed',sans-serif;
  font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  cursor:pointer;transition:all .2s;
  border:1px solid transparent;border-bottom:none;
  color:rgba(255,255,255,0.45);background:transparent;
  margin-top:auto;
}
.sailor-tab .sail-no{
  font-size:10px;font-weight:400;letter-spacing:.08em;
  opacity:.6;
}
.sailor-tab.m-tab:hover{color:rgba(255,255,255,0.75)}
.sailor-tab.s-tab:hover{color:rgba(255,255,255,0.75)}
.sailor-tab.m-tab.active{
  background:var(--blue-dim);color:#fff;
  border-color:rgba(46,127,212,0.3);
  border-bottom:3px solid var(--blue);
  margin-bottom:-3px;
}
.sailor-tab.s-tab.active{
  background:var(--red-dim);color:#fff;
  border-color:rgba(231,76,60,0.3);
  border-bottom:3px solid var(--red);
  margin-bottom:-3px;
}
.mast-right{
  margin-left:auto;display:flex;align-items:center;
  font-size:11px;color:rgba(255,255,255,0.3);
  letter-spacing:.05em;text-transform:uppercase;
}

/* ── Season selector ── */
.season-bar{
  background:var(--ink2);
  border-bottom:1px solid rgba(255,255,255,0.06);
  padding:8px 40px;
  display:flex;align-items:center;gap:8px;
}
.season-label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:rgba(255,255,255,0.4);
  margin-right:10px;
}
.season-pill{
  padding:8px 20px;border-radius:3px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;transition:all .15s;
  color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.15);
}
.season-pill:hover{color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.08)}
.season-pill.active{
  background:var(--gold);color:var(--ink);
  border-color:var(--gold);
  box-shadow:0 2px 8px rgba(184,134,11,0.3);
}
.season-meta{
  margin-left:auto;font-size:12px;
  color:rgba(255,255,255,0.3);letter-spacing:.05em;
}

/* ── Panel ── */
.panel{display:none}
.panel.active{display:block;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── Season panel ── */
.season-panel{display:none}
.season-panel.active{display:block}

/* ── Content grid ── */
.content{padding:40px 48px;display:flex;flex-direction:column;gap:36px}

/* ── Scorecard hero ── */
.scorecard{
  background:var(--ink);color:var(--paper);
  border-radius:6px;overflow:hidden;
  display:grid;grid-template-columns:auto 1fr auto;
  box-shadow:0 4px 24px rgba(10,22,40,0.15);
}
.sc-left{
  padding:36px 40px;
  border-right:1px solid rgba(255,255,255,0.07);
  display:flex;flex-direction:column;justify-content:center;
  min-width:180px;
}
.sc-sailor-name{
  font-family:'Teko',sans-serif;
  font-size:clamp(48px,5vw,72px);
  font-weight:500;letter-spacing:-.01em;line-height:.9;
  margin-bottom:6px;
}
.sc-sailor-name.m-name{color:var(--blue-lt)}
.sc-sailor-name.s-name{color:var(--red-lt)}
.sc-sail{
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(255,255,255,0.45);
}
.sc-center{
  padding:28px 36px;
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:1px;background:rgba(255,255,255,0.05);
}
.sc-stat{background:var(--ink);padding:22px 16px;text-align:center}
.sc-stat-n{
  font-family:'Teko',sans-serif;font-size:56px;font-weight:500;
  line-height:.9;margin-bottom:6px;
}
.m-panel .sc-stat-n{color:var(--blue-lt)}
.s-panel .sc-stat-n{color:var(--red-lt)}
.sc-stat-l{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(255,255,255,0.4);
}
.sc-stat-s{font-size:11px;color:rgba(255,255,255,0.28);margin-top:4px}
.sc-right{
  padding:28px 32px;border-left:1px solid rgba(255,255,255,0.07);
  display:flex;flex-direction:column;justify-content:center;gap:12px;
  min-width:200px;
}
.sc-badge{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:4px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:14px;font-weight:600;letter-spacing:.06em;
}
.sc-badge-gold{background:var(--gold-dim);border:1px solid rgba(184,134,11,0.25);color:var(--gold-lt)}
.sc-badge-blue{background:var(--blue-dim);border:1px solid rgba(26,95,171,0.25);color:#5BA8F0}
.sc-badge-green{background:var(--green-dim);border:1px solid rgba(26,122,74,0.25);color:#4CAF82}
.sc-badge-red{background:var(--red-dim);border:1px solid rgba(192,57,43,0.2);color:#E88080}
.sc-badge-ico{font-size:14px;width:18px;text-align:center;flex-shrink:0}

/* ── Section header ── */
.sec{
  display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:20px;
}
.sec h2{
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink);
}
.sec-sub{font-size:13px;color:var(--muted);letter-spacing:.03em}

/* ── Goal zone banner ── */
.goal-strip{
  background:var(--green-dim);border:1px solid rgba(26,122,74,0.2);
  border-radius:4px;padding:16px 22px;
  display:flex;align-items:center;gap:16px;
}
.goal-strip-ico{font-size:20px}
.goal-strip-text{font-size:14px;color:var(--ink2);line-height:1.5}
.goal-strip-text strong{color:var(--green);font-weight:600}

/* ── Career chart container ── */
.chart-card{
  background:#fff;border:1px solid var(--rule);border-radius:6px;
  padding:24px 28px;
  box-shadow:0 1px 4px rgba(10,22,40,0.06);
}
.chart-card.dark{background:var(--ink);border-color:rgba(255,255,255,0.08)}
.cv{position:relative}
.cv-180{height:200px}.cv-220{height:260px}.cv-260{height:300px}
.cv-300{height:340px}.cv-160{height:190px}

/* ── Chart legend ── */
.leg-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.leg-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.leg-line{width:16px;height:2px;border-radius:1px;flex-shrink:0}
.leg-dline{width:16px;height:0;border-top:2px dashed;flex-shrink:0}
.leg-band{
  width:16px;height:7px;border-radius:2px;
  background:rgba(26,122,74,0.15);border:1px solid rgba(26,122,74,0.3);flex-shrink:0;
}

/* ── Two / three column grids ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}

/* ── Girls panel ── */
.girls-card{
  background:#fff;border:1px solid var(--rule);border-radius:6px;
  overflow:hidden;box-shadow:0 1px 4px rgba(10,22,40,0.06);
}
.girls-card-top{
  background:var(--ink3);color:var(--paper);
  padding:20px 26px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:3px solid var(--gold);
}
.girls-card-top h3{
  font-family:'Barlow Condensed',sans-serif;
  font-size:14px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
}
.girls-best{
  font-family:'Teko',sans-serif;font-size:42px;font-weight:500;
  color:var(--gold-lt);line-height:1;
}
.girls-best-lbl{font-size:11px;color:rgba(255,255,255,0.4);margin-top:3px}
.girls-stats-strip{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:1px;background:var(--rule);
}
.gs-stat{background:#fff;padding:18px 14px;text-align:center}
.gs-n{
  font-family:'Teko',sans-serif;font-size:38px;font-weight:500;
  color:var(--ink2);line-height:1;margin-bottom:4px;
}
.gs-l{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);
}
.girls-body{padding:20px 24px}
.girls-tbl{width:100%;border-collapse:collapse}
.girls-tbl th{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted2);padding:0 12px 10px;text-align:left;
  border-bottom:2px solid var(--rule2);
}
.girls-tbl th:not(:first-child){text-align:center}
.girls-tbl td{
  padding:14px 12px;border-bottom:1px solid var(--rule);
  font-size:14px;color:var(--ink);vertical-align:middle;
}
.girls-tbl td:not(:first-child){text-align:center}
.girls-tbl tr:last-child td{border-bottom:none}
.g-rname{font-weight:600;font-size:15px;color:var(--ink)}
.g-rdate{font-size:12px;color:var(--muted);margin-top:2px}
.g-pos-big{font-family:'Teko',sans-serif;font-size:34px;line-height:1;color:var(--ink2)}
.g-of{font-size:12px;color:var(--muted)}
.pct-cell{display:flex;align-items:center;gap:8px}
.pct-bg{flex:1;height:5px;background:var(--rule);border-radius:2px;overflow:hidden;min-width:50px}
.pct-fill{height:100%;border-radius:2px}
.pct-txt{font-size:12px;color:var(--muted);width:34px;text-align:right;font-weight:600}
.g-badge{
  display:inline-block;padding:3px 9px;border-radius:2px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.g-badge-top3{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(184,134,11,0.2)}
.g-badge-top30{background:rgba(26,95,171,0.08);color:var(--blue);border:1px solid rgba(26,95,171,0.15)}
.g-badge-rec{background:rgba(10,22,40,0.05);color:var(--muted);border:1px solid var(--rule)}

/* ── Girls chart section ── */
.girls-trend{
  border-top:1px solid var(--rule);padding:20px 24px;
}
.girls-trend-lbl{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px;
}
.girls-int-bel{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;
  border-top:1px solid var(--rule);padding:20px 24px;
}
.gib-card{
  background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:16px 18px;
}
.gib-lbl{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;
}
.gib-val{
  font-family:'Teko',sans-serif;font-size:42px;font-weight:500;
  line-height:1;color:var(--ink2);
}
.gib-sub{font-size:12px;color:var(--muted);margin-top:3px}

/* ── Regatta log ── */
.reg-log{display:flex;flex-direction:column;gap:14px}
.reg-row{
  background:#fff;border:1px solid var(--rule);border-radius:6px;
  overflow:hidden;box-shadow:0 1px 3px rgba(10,22,40,0.04);
}
.reg-hdr{
  display:grid;grid-template-columns:auto 1fr auto auto auto;
  gap:0 18px;align-items:center;
  padding:18px 22px;cursor:pointer;
  transition:background .15s;user-select:none;
}
.reg-hdr:hover{background:rgba(10,22,40,0.02)}
.reg-hdr.open{border-bottom:1px solid var(--rule)}
.reg-num{
  font-family:'Teko',sans-serif;font-size:26px;font-weight:500;
  color:var(--muted2);width:32px;text-align:center;flex-shrink:0;
}
.reg-info h3{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:2px}
.reg-info p{font-size:13px;color:var(--muted)}
.reg-final{text-align:right}
.reg-final-n{
  font-family:'Teko',sans-serif;font-size:44px;font-weight:500;line-height:.9;
}
.m-panel .reg-final-n{color:var(--blue)}
.s-panel .reg-final-n{color:var(--red)}
.reg-final-of{font-size:12px;color:var(--muted)}
.zb{
  padding:4px 11px;border-radius:2px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  white-space:nowrap;
}
.zb-goal{background:var(--green-dim);color:var(--green);border:1px solid rgba(26,122,74,0.2)}
.zb-great{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(184,134,11,0.2)}
.zb-elite{background:rgba(139,92,246,0.08);color:#7C5CBF;border:1px solid rgba(139,92,246,0.2)}
.zb-push{background:rgba(10,22,40,0.05);color:var(--muted);border:1px solid var(--rule)}
.reg-expand{
  font-size:12px;color:var(--muted2);
  transition:transform .25s;flex-shrink:0;
}
.reg-hdr.open .reg-expand{transform:rotate(180deg)}

/* ── Race table inside regatta ── */
.reg-body{display:none;padding:0 22px 16px}
.reg-body.open{display:block;animation:slide-in .2s ease}
@keyframes slide-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.races-grid{margin-top:12px}
.race-hdr,.race-row{
  display:grid;
  grid-template-columns:36px 48px 1fr 80px 64px 100px;
  gap:10px;align-items:center;padding:10px 0;
}
.race-hdr{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted2);border-bottom:1px solid var(--rule);padding-bottom:8px;
}
.race-row{border-bottom:1px solid rgba(10,22,40,0.06)}
.race-row:last-child{border-bottom:none}
.race-row.disc{opacity:.3}
.rn{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--muted)}
.rp{font-family:'Teko',sans-serif;font-size:26px;line-height:1}
.m-panel .rp{color:var(--blue)}.s-panel .rp{color:var(--red)}
.race-row.disc .rp{color:var(--muted)!important}
.prog{display:flex;align-items:center;gap:8px}
.prog-bg{flex:1;height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px}
.prog-pct{font-size:12px;color:var(--muted);width:32px;text-align:right;font-weight:600}
.disc-note{font-size:11px;color:var(--muted);font-style:italic}
.grp-tag{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 8px;border-radius:2px;display:inline-block;
}
.gt-blue{background:rgba(26,95,171,0.10);color:var(--blue)}
.gt-yellow{background:rgba(184,134,11,0.12);color:var(--gold)}
.gt-red{background:rgba(192,57,43,0.10);color:var(--red)}
.gt-bronze{background:rgba(150,100,40,0.10);color:#8B6234}
.gt-silver{background:rgba(120,120,130,0.10);color:#6B7280}
.gt-gold{background:rgba(184,134,11,0.15);color:var(--gold)}
.race-note-txt{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Conditions footer */
.cond-strip{
  display:flex;gap:16px;flex-wrap:wrap;
  margin-top:12px;padding-top:12px;
  border-top:1px solid var(--rule);
}
.cond-item{
  display:flex;align-items:center;gap:6px;
  font-size:13px;color:var(--muted);
}
.cond-item.good{color:var(--green)}

/* ── Badges ── */
.badges-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:10px;
  margin-bottom:20px;
}
.badge{
  background:#fff;border:1px solid var(--rule);border-radius:4px;
  padding:14px 10px;text-align:center;position:relative;overflow:hidden;
  box-shadow:0 1px 3px rgba(10,22,40,0.04);
}
.badge.earned{
  border-color:rgba(184,134,11,0.4);
  background:rgba(184,134,11,0.03);
}
.badge-ico{font-size:28px;margin-bottom:6px;display:block}
.badge:not(.earned) .badge-ico{filter:grayscale(1);opacity:.2}
.badge.earned .badge-ico{animation:bob 2.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.badge-cnt{
  position:absolute;top:5px;right:5px;
  background:var(--gold);color:var(--ink);
  font-size:10px;font-weight:800;padding:2px 5px;
  border-radius:10px;min-width:17px;text-align:center;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em;
}
.badge-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  margin-bottom:2px;
}
.badge:not(.earned) .badge-name{color:var(--muted2)}
.badge.earned .badge-name{color:var(--gold)}
.badge-detail{font-size:10px;color:var(--muted);line-height:1.35}
.badge.earned .badge-detail{color:rgba(184,134,11,0.7);font-weight:500}

/* ── Trophy cabinet ── */
.trophy-cab{
  background:#fff;border:1px solid var(--rule);border-radius:4px;
  padding:20px 24px;
  box-shadow:0 1px 3px rgba(10,22,40,0.04);
}
.tc-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.tc-ttl{
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink);
}
.tc-count{
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:600;letter-spacing:.06em;
  padding:3px 10px;border-radius:2px;
  background:var(--gold-dim);color:var(--gold);border:1px solid rgba(184,134,11,0.2);
}
.tg{margin-bottom:14px}
.tg:last-child{margin-bottom:0}
.tg-lbl{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted2);margin-bottom:6px;
}
.ti{
  display:flex;align-items:center;gap:12px;
  padding:9px 12px;background:var(--paper);border:1px solid var(--rule);
  border-radius:3px;margin-bottom:5px;
}
.ti:last-child{margin-bottom:0}
.ti-ico{font-size:16px;flex-shrink:0;width:22px;text-align:center}
.ti-body{flex:1;min-width:0}
.ti-name{font-size:13px;font-weight:600;color:var(--ink)}
.ti-detail{font-size:12px;color:var(--muted);margin-top:2px}
.ti-date{font-size:11px;color:var(--muted2);white-space:nowrap;flex-shrink:0}

/* ── Footer ── */
.site-footer{
  background:var(--ink);color:rgba(255,255,255,0.25);
  padding:18px 40px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center;
  margin-top:auto;
}

/* ── Responsive ── */
@media(max-width:760px){
  .masthead,.season-bar,.content{padding-left:16px;padding-right:16px}
  .scorecard{grid-template-columns:1fr}
  .sc-left,.sc-right{border:none}
  .sc-center{grid-template-columns:repeat(3,1fr)}
  .grid2,.grid3{grid-template-columns:1fr}
  .badges-grid{grid-template-columns:repeat(4,1fr)}
  .girls-int-bel{grid-template-columns:1fr}
  .race-hdr,.race-row{grid-template-columns:28px 38px 1fr 60px}
  .race-hdr>:nth-child(5),.race-row>:nth-child(5),
  .race-hdr>:nth-child(6),.race-row>:nth-child(6){display:none}
}
</style>
</head>

/* ── Helpers ── */
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function pct(place,fleet){return fleet>1?Math.round((1-(place-1)/(fleet-1))*1000)/10:0;}
function pfp(p,fleet){return Math.max(1,Math.min(fleet,Math.round(1+(1-p/100)*(fleet-1))));}
function zoneOf(place,fleet,cfg){
  var p=pct(place,fleet);
  if(p>=90)return{label:'Elite',cls:'zb-elite'};
  if(p>=75)return{label:'Great',cls:'zb-great'};
  var lo=pfp(cfg.goal_pct_hi,fleet),hi=pfp(cfg.goal_pct_lo,fleet);
  if(place>=lo&&place<=hi)return{label:'Goal Zone',cls:'zb-goal'};
  if(p>=50)return{label:'Top Half',cls:'zb-great'};
  return{label:'Keep going',cls:'zb-push'};
}
function barColor(p){
  if(p>=75)return'#1A7A4A';
  if(p>=50)return'#B8860B';
  if(p>=30)return'#C0392B';
  return'#8B0000';
}
function grpTag(note){
  if(!note)return'';
  var n=note.toLowerCase();
  if(n.includes('blue silver')||n.includes('silver'))return{cls:'gt-silver',lbl:'Silver'};
  if(n.includes('blue'))return{cls:'gt-blue',lbl:'Blue'};
  if(n.includes('yellow'))return{cls:'gt-yellow',lbl:'Yellow'};
  if(n.includes('red'))return{cls:'gt-red',lbl:'Red'};
  if(n.includes('bronze'))return{cls:'gt-bronze',lbl:'Bronze'};
  if(n.includes('gold'))return{cls:'gt-gold',lbl:'Gold'};
  return null;
}
function cleanNote(note){
  if(!note)return'';
  return note.replace(/blue silver fleet\s*\|?\s*/i,'')
    .replace(/blue fleet\s*\|?\s*/i,'').replace(/yellow fleet\s*\|?\s*/i,'')
    .replace(/red fleet\s*\|?\s*/i,'').replace(/bronze fleet\s*\|?\s*/i,'')
    .replace(/silver fleet\s*\|?\s*/i,'').trim();
}
function calcStats(regs){
  var finals=regs.map(function(r){return r.finalPos;});
  var spreads=regs.map(function(r){
    var v=r.races.filter(function(x){return !x.discard;}).map(function(x){return x.place;});
    return v.length>=2?Math.max(...v)-Math.min(...v):0;
  });
  var best=regs.map(function(r){
    return Math.min(...r.races.filter(function(x){return !x.discard;}).map(function(x){return x.place;}));
  });
  var worst=regs.map(function(r){
    return Math.max(...r.races.filter(function(x){return !x.discard;}).map(function(x){return x.place;}));
  });
  var sum=0,runAvg=finals.map(function(v,i){sum+=v;return Math.round(sum/(i+1));});
  return{
    pb:Math.min(...finals),
    avg:Math.round(finals.reduce(function(a,b){return a+b;},0)/finals.length),
    bestRace:Math.min(...best),
    consistent:spreads.filter(function(s){return s<=5;}).length,
    n:regs.length,spreads,finals,best,worst,runAvg
  };
}

function goalZonePlugin(regs,cfg){
  return{id:'gz',beforeDatasetsDraw:function(chart){
    var{ctx,chartArea:ca,scales:{x,y}}=chart;if(!ca)return;
    ctx.save();
    var bw=regs.length>1?(x.getPixelForValue(1)-x.getPixelForValue(0)):ca.width;
    regs.forEach(function(reg,i){
      var lo=pfp(cfg.goal_pct_hi,reg.fleet),hi=pfp(cfg.goal_pct_lo,reg.fleet);
      var cx=x.getPixelForValue(i),xL=cx-bw*.5,xR=cx+bw*.5;
      var y1=y.getPixelForValue(lo-.5),y2=y.getPixelForValue(hi+.5);
      ctx.fillStyle='rgba(26,122,74,0.09)';
      ctx.fillRect(Math.max(ca.left,xL),Math.min(y1,y2),
        Math.min(xR,ca.right)-Math.max(ca.left,xL),Math.abs(y2-y1));
    });
    if(regs.length>0){
      var lo0=pfp(cfg.goal_pct_hi,regs[0].fleet),hi0=pfp(cfg.goal_pct_lo,regs[0].fleet);
      [lo0,hi0].forEach(function(v){
        var yy=y.getPixelForValue(v);
        ctx.strokeStyle='rgba(26,122,74,0.3)';ctx.setLineDash([4,4]);ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(ca.left,yy);ctx.lineTo(ca.right,yy);ctx.stroke();
      });
      ctx.setLineDash([]);ctx.fillStyle='#1A7A4A';ctx.font='600 11px Barlow Condensed';
      ctx.fillText('GOAL ZONE',ca.left+6,y.getPixelForValue(pfp(cfg.goal_pct_lo,regs[0].fleet))-4);
    }
    ctx.restore();
  }};
}

    var y1=y.getPixelForValue(lo-.5),y2=y.getPixelForValue(hi+.5);
    ctx.save();ctx.fillStyle='rgba(26,122,74,0.08)';
    ctx.fillRect(ca.left,Math.min(y1,y2),ca.width,Math.abs(y2-y1));
    ctx.strokeStyle='rgba(26,122,74,0.25)';ctx.setLineDash([4,4]);ctx.lineWidth=1;
    [y1,y2].forEach(function(yy){ctx.beginPath();ctx.moveTo(ca.left,yy);ctx.lineTo(ca.right,yy);ctx.stroke();});
    ctx.setLineDash([]);ctx.fillStyle='#1A7A4A';ctx.font='600 11px Barlow Condensed';
    ctx.fillText('GOAL ZONE',ca.left+6,Math.min(y1,y2)-4);ctx.restore();
  }};
}
function scatterGoalPlugin(breaks,cfg){

/* ── Build a full sailor panel ── */
function buildPanel(key, sailorData, activeSeasonKey) {
  var panel = document.getElementById('p-'+key);
  var sailor = key==='mette'?'Mette':'Stella';
  var cfg = CFG[sailor];
  var col = key==='mette'?'#1A5FAB':'#C0392B';
  var colLt = key==='mette'?'#2E7FD4':'#E74C3C';
  var pfx = key[0];

  if(!sailorData||typeof sailorData!=='object'){
    panel.innerHTML='<div style="padding:60px;text-align:center;color:var(--muted)">No data.</div>';
    return;
  }

  var seasons = Object.keys(sailorData).sort();
  if(!activeSeasonKey) activeSeasonKey = seasons[seasons.length-1];
  var regs = sailorData[activeSeasonKey]||[];
  if(!regs.length){
    panel.innerHTML='<div style="padding:60px;text-align:center;color:var(--muted)">No data for this season.</div>';
    return;
  }

  /* Destroy existing charts */
  Chart.helpers.each(Chart.instances, function(c){
    if(c.canvas&&c.canvas.id&&c.canvas.id.startsWith(pfx+'-'))c.destroy();
  });

  var st = calcStats(regs);
  var maxFleet = Math.max(...regs.map(function(r){return r.fleet;}));
  var avgFleet = Math.round(regs.reduce(function(a,r){return a+r.fleet;},0)/regs.length);

  /* Wind & Performance — dumbbell per day: group races by wind conditions */
  var windSteadyPts=[],windGustPts=[],windRegs=[];
  regs.forEach(function(reg){
    /* Group races by unique wind steady+gust combo (= proxy for different days) */
    var dayMap={};
    reg.races.forEach(function(r){
      var wsStr=String(r.windSteady||reg.windSteady||'');
      var ws=0;
      if(wsStr.indexOf('-')>0){var pp=wsStr.split('-');ws=(parseFloat(pp[0])+parseFloat(pp[1]))/2;}
      else ws=parseFloat(wsStr)||0;
      if(ws<=0)return;
      var gst=parseFloat(r.windGusts||reg.windGusts)||ws;
      var key=ws+'|'+gst;
      if(!dayMap[key])dayMap[key]={ws:ws,gst:gst,races:[],dir:r.windDir||reg.windDir||'—'};
      if(!r.discard)dayMap[key].races.push(r);
    });
    var days=Object.values(dayMap);
    if(days.length===0){
      /* Fallback: use regatta-level wind if no per-race data */
      var wsStr=String(reg.windSteady||'');
      var ws=0;
      if(wsStr.indexOf('-')>0){var pp=wsStr.split('-');ws=(parseFloat(pp[0])+parseFloat(pp[1]))/2;}
      else ws=parseFloat(wsStr)||0;
      if(ws>0){
        var gst=parseFloat(reg.windGusts)||ws;
        var pctVal=reg.fleet>1?Math.round((1-(reg.finalPos-1)/(reg.fleet-1))*100):0;
        days=[{ws:ws,gst:gst,dir:reg.windDir||'—',pct:pctVal,races:reg.races}];
      }
    }
    days.forEach(function(d,di){
      if(d.races.length===0)return;
      /* Average race-level percentile for this day's races */
      var sum=0,cnt=0;
      d.races.forEach(function(r){
        var rf=r.raceFleet||reg.fleet;
        if(rf>1){sum+=(1-(r.place-1)/(rf-1))*100;cnt++;}
      });
      var pctVal=cnt>0?Math.round(sum/cnt):0;
      var perf=pctVal>=60?'good':pctVal>=35?'ok':'weak';
      var dayLabel=days.length>1?' (Day '+(di+1)+')':'';
      windSteadyPts.push({x:d.ws,y:pctVal});
      windGustPts.push({x:d.gst,y:pctVal});
      windRegs.push({name:reg.name+dayLabel,fleet:reg.fleet,pos:reg.finalPos,
        steady:d.ws,gust:d.gst,dir:d.dir,pct:pctVal,perf:perf,
        raceCount:d.races.length});
    });
  });

  /* Steadiness — % of counted races within ±3 positions of median */
  var steadyData=regs.map(function(reg){
    var v=reg.races.filter(function(r){return !r.discard;}).map(function(r){return r.place;});
    if(v.length<2)return 100;
    var sorted=v.slice().sort(function(a,b){return a-b;});
    var med=sorted[Math.floor(sorted.length/2)];
    var within=v.filter(function(p){return Math.abs(p-med)<=3;}).length;
    return Math.round(within/v.length*100);
  });

  /* Discard Analysis — count by specific race number */
  var discByRace={};
  var discTotal=0;
  regs.forEach(function(reg){
    reg.races.forEach(function(r){
      if(!r.discard)return;
      discTotal++;
      var key='R'+r.num;
      discByRace[key]=(discByRace[key]||0)+1;
    });
  });
  var discRaceLabels=Object.keys(discByRace).sort(function(a,b){return parseInt(a.slice(1))-parseInt(b.slice(1));});
  var discRaceCounts=discRaceLabels.map(function(k){return discByRace[k];});

  /* Girls */
  var gR = regs.filter(function(r){return r.girlsPos!=null&&r.girlsTotal>0;});
  var hg = gR.length>0;
  var gBest = hg?Math.min(...gR.map(function(r){return r.girlsPos;})):null;
  var gAvg  = hg?(gR.reduce(function(a,r){return a+r.girlsPos;},0)/gR.length).toFixed(1):null;
  var gTop3 = hg?gR.filter(function(r){return r.girlsPos<=3;}).length:0;
  var gPctA = hg?(gR.map(function(r){return pct(r.girlsPos,r.girlsTotal);}).reduce(function(a,b){return a+b;},0)/gR.length).toFixed(1):null;
  var mxGT  = hg?Math.max(...gR.map(function(r){return r.girlsTotal;})):10;
  var gcId  = pfx+'-gc';
  /* Belgian girls */
  var bgR = regs.filter(function(r){return r.belgianGirlsPos!=null&&r.belgianGirlsTotal>0;});
  var hbg = bgR.length>0;
  var bgBest = hbg?Math.min(...bgR.map(function(r){return r.belgianGirlsPos;})):null;
  var bgAvg  = hbg?(bgR.reduce(function(a,r){return a+r.belgianGirlsPos;},0)/bgR.length).toFixed(1):null;

  /* Trophies */
  var T=[];var runB=Infinity;
  regs.forEach(function(reg){
    if(reg.finalPos<runB){runB=reg.finalPos;T.push({ico:'\uD83C\uDFC5',key:'pb',name:'Personal Best',detail:ord(reg.finalPos)+' at '+reg.name,date:reg.date});}
  });
  regs.forEach(function(reg){
    var lo=pfp(cfg.goal_pct_hi,reg.fleet),hi=pfp(cfg.goal_pct_lo,reg.fleet);
    if(reg.finalPos>=lo&&reg.finalPos<=hi)T.push({ico:'\uD83C\uDFAF',key:'goal',name:'Goal Zone',detail:ord(reg.finalPos)+' of '+reg.fleet+' (band '+lo+'\u2013'+hi+')',date:reg.date});
  });
  regs.forEach(function(reg){
    reg.races.filter(function(r){return !r.discard&&r.place<=10;}).forEach(function(r){
      T.push({ico:'\uD83D\uDD25',key:'top10',name:'Top 10 Race',detail:ord(r.place)+' in R'+r.num+' at '+reg.name,date:reg.date});
    });
  });
  regs.forEach(function(reg,ri){
    if(st.spreads[ri]<=5)T.push({ico:'\uD83D\uDCD0',key:'con',name:'Consistent',detail:'Spread '+st.spreads[ri]+' at '+reg.name,date:reg.date});
  });
  gR.forEach(function(reg){
    if(reg.girlsPos<=3)T.push({ico:'\uD83C\uDFC6',key:'gtop3',name:'Girls Top 3',detail:ord(reg.girlsPos)+' of '+reg.girlsTotal+' at '+reg.name,date:reg.date});
  });
  if(hg){var gbr=gR.reduce(function(a,r){return a.girlsPos<r.girlsPos?a:r;});
    T.push({ico:'\u2B50',key:'gbest',name:'Girls Season Best',detail:ord(gbr.girlsPos)+' of '+gbr.girlsTotal+' at '+gbr.name,date:gbr.date});}
  if(regs.length>=6){
    var l3=regs.slice(-3).reduce(function(a,r){return a+r.finalPos;},0)/3;
    var f3=regs.slice(0,3).reduce(function(a,r){return a+r.finalPos;},0)/3;
    if(l3<f3)T.push({ico:'\uD83D\uDCC8',key:'trend',name:'Trending Up',detail:'Last 3 regattas better than first 3',date:regs.at(-1).date});
  }
  var counts={};T.forEach(function(t){counts[t.key]=(counts[t.key]||0)+1;});
  var BDEFS=[
    {key:'pb',ico:'\uD83C\uDFC5',name:'Personal Best',locked:'First regatta'},
    {key:'goal',ico:'\uD83C\uDFAF',name:'Goal Zone',locked:'Finish in band'},
    {key:'top10',ico:'\uD83D\uDD25',name:'Top 10 Race',locked:'Single race top 10'},
    {key:'con',ico:'\uD83D\uDCD0',name:'Consistent',locked:'Spread \u22645'},
    {key:'gtop3',ico:'\uD83C\uDFC6',name:'Girls Top 3',locked:'Top 3 girls'},
    {key:'gbest',ico:'\u2B50',name:'Girls Best',locked:'Record girls result'},
    {key:'trend',ico:'\uD83D\uDCC8',name:'Trending Up',locked:'Need 6 regattas'},
  ];
  var TG={};BDEFS.forEach(function(b){
    var ins=T.filter(function(t){return t.key===b.key;});
    if(ins.length)TG[b.key]={ico:b.ico,name:b.name,instances:ins};
  });

  /* Career data for career chart */
  var careerPts=[];var careerCols=[];var careerLabels=[];
  var careerBounds=[];var careerPos=0;
  seasons.forEach(function(sKey){
    var sRegs=sailorData[sKey]||[];
    var sStart=careerPos;
    sRegs.forEach(function(reg){
      var p=reg.fleet>1?Math.round((1-(reg.finalPos-1)/(reg.fleet-1))*100):0;
      careerPts.push(p);
      careerCols.push(sKey===activeSeasonKey?colLt:col+'88');
      careerLabels.push(reg.name.length>10?reg.name.substring(0,10)+'\u2026':reg.name);
      careerPos++;
    });
    if(sRegs.length) careerBounds.push({start:sStart,end:careerPos-1,season:sKey});
  });

  /* Year-over-Year data */
  var MONTHS=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function dateToMonth(d){var p=d.split('.');return parseInt(p[1])+(parseInt(p[0])-1)/30;}
  var prevIdx=seasons.indexOf(activeSeasonKey)-1;
  var prevSeasonKey=prevIdx>=0?seasons[prevIdx]:null;
  var prevRegs=prevSeasonKey?sailorData[prevSeasonKey]||[]:[];
  var yoyPrev=prevRegs.map(function(r){return{x:dateToMonth(r.date),y:pct(r.finalPos,r.fleet),name:r.name,date:r.date,pos:r.finalPos,fleet:r.fleet};});
  var yoyCurr=regs.map(function(r){return{x:dateToMonth(r.date),y:pct(r.finalPos,r.fleet),name:r.name,date:r.date,pos:r.finalPos,fleet:r.fleet};});

  /* Girls table */
  var girlsRows = hg ? gR.map(function(reg){
    var p=pct(reg.girlsPos,reg.girlsTotal);
    var fc=reg.girlsPos<=3?'var(--gold)':'var(--blue)';
    var badge=reg.girlsPos<=3?'<span class="g-badge g-badge-top3">Top 3</span>':
      p>=70?'<span class="g-badge g-badge-top30">Top 30%</span>':
      '<span class="g-badge g-badge-rec">Recorded</span>';
    var row1='<tr>'
      +'<td><div class="g-rname">'+reg.name+'</div><div class="g-rdate">'+reg.date+' &bull; Fleet '+reg.fleet+'</div></td>'
      +'<td><div class="g-pos-big">'+ord(reg.girlsPos)+'</div></td>'
      +'<td><div class="g-of">of '+reg.girlsTotal+'</div></td>'
      +'<td><div class="pct-cell"><div class="pct-bg"><div class="pct-fill" style="width:'+Math.round(p)+'%;background:'+fc+'"></div></div><span class="pct-txt">'+p+'%</span></div></td>'
      +'<td>'+badge+'</td>'
      +'</tr>';
    var row2='';
    if(reg.belgianGirlsPos!=null&&reg.belgianGirlsTotal>0){
      var bp=pct(reg.belgianGirlsPos,reg.belgianGirlsTotal);
      var bfc=reg.belgianGirlsPos<=3?'var(--gold)':'var(--gold)';
      var bbadge=reg.belgianGirlsPos<=3?'<span class="g-badge g-badge-top3">Top 3</span>':
        bp>=70?'<span class="g-badge g-badge-top30">Top 30%</span>':
        '<span class="g-badge g-badge-rec">Recorded</span>';
      row2='<tr style="background:rgba(184,134,11,0.04)">'
        +'<td style="padding-left:28px"><div class="g-rdate" style="font-weight:600;color:var(--gold)">&#9873; Belgian girls</div></td>'
        +'<td><div class="g-pos-big" style="font-size:28px;color:var(--gold)">'+ord(reg.belgianGirlsPos)+'</div></td>'
        +'<td><div class="g-of">of '+reg.belgianGirlsTotal+'</div></td>'
        +'<td><div class="pct-cell"><div class="pct-bg"><div class="pct-fill" style="width:'+Math.round(bp)+'%;background:var(--gold)"></div></div><span class="pct-txt">'+bp+'%</span></div></td>'
        +'<td>'+bbadge+'</td>'
        +'</tr>';
    }
    return row1+row2;
  }).join('') : '';

  /* Regatta log */
  var regLogHtml = regs.map(function(reg,ri){
    var zone=zoneOf(reg.finalPos,reg.fleet,cfg);
    var lo=pfp(cfg.goal_pct_hi,reg.fleet),hi=pfp(cfg.goal_pct_lo,reg.fleet);
    var spread=st.spreads[ri];
    var racesHtml=reg.races.map(function(r){
      var rf=r.raceFleet||reg.fleet;
      var p=pct(r.place,rf);
      var bw=Math.max(3,Math.round(p));
      var z=zoneOf(r.place,rf,cfg);
      var gt=grpTag(r.note);
      var noteClean=cleanNote(r.note);
      var rfLabel=rf!==reg.fleet?' <span style="font-size:11px;color:var(--muted);font-weight:400">/ '+rf+'</span>':'';
      if(r.discard){
        return '<div class="race-row disc">'
          +'<span class="rn">'+r.num+rfLabel+'</span>'
          +'<span class="rp">'+r.place+'</span>'
          +'<span class="disc-note">Discard'+(noteClean?' \u2014 '+noteClean:'')+'</span>'
          +'<span></span>'
          +'<span>'+(gt?'<span class="grp-tag '+gt.cls+'">'+gt.lbl+'</span>':'')+'</span>'
          +'<span></span>'
          +'</div>';
      }
      return '<div class="race-row">'
        +'<span class="rn">'+r.num+rfLabel+'</span>'
        +'<span class="rp">'+r.place+'</span>'
        +'<div class="prog"><div class="prog-bg"><div class="prog-fill" style="width:'+bw+'%;background:'+barColor(p)+'"></div></div><span class="prog-pct">'+p+'%</span></div>'
        +'<span class="zb '+z.cls+'" style="font-size:9px">'+z.label+'</span>'
        +'<span>'+(gt?'<span class="grp-tag '+gt.cls+'">'+gt.lbl+'</span>':'')+'</span>'
        +'<span class="race-note-txt">'+noteClean+'</span>'
        +'</div>';
    }).join('');
    return '<div class="reg-row">'
      +'<div class="reg-hdr" onclick="toggleReg(\''+pfx+'\','+ri+',this)">'
      +'<div class="reg-num">'+(ri+1)+'</div>'
      +'<div class="reg-info"><h3>'+reg.name+'</h3>'
      +'<p>'+reg.date+' &bull; Fleet '+reg.fleet+' &bull; Goal band '+lo+'\u2013'+hi+'</p></div>'
      +'<div class="reg-final"><div class="reg-final-n">'+reg.finalPos+'</div><div class="reg-final-of">of '+reg.fleet+'</div></div>'
      +'<span class="zb '+zone.cls+'">'+zone.label+'</span>'
      +'<span class="reg-expand">&#9660;</span>'
      +'</div>'
      +'<div class="reg-body" id="'+pfx+'-rb-'+ri+'">'
      +'<div class="races-grid">'
      +'<div class="race-hdr"><span>Race</span><span>Place</span><span>Fleet %</span><span>Zone</span><span>Group</span><span>Notes</span></div>'
      +racesHtml+'</div>'
      +'<div class="cond-strip">'
      +(reg.weather?'<div class="cond-item">'+reg.weather+'</div>':'')
      +(reg.windSteady&&reg.windGusts?'<div class="cond-item">'+reg.windSteady+'\u2013'+reg.windGusts+'kn'+(reg.windDir?' '+reg.windDir:'')+'</div>':'')
      +(spread<=5?'<div class="cond-item good">Consistent \u2014 spread '+spread+'</div>':'')
      +'</div></div></div>';
  }).join('');

  /* Badges */
  var badgesHtml = BDEFS.map(function(b){
    var n=counts[b.key]||0,earned=n>0;
    var last=T.filter(function(t){return t.key===b.key;});
    last=last.length?last[last.length-1]:null;

      datasets:[
        {label:'Best',data:st.best,backgroundColor:'#1A7A4A',borderRadius:{topLeft:3,topRight:3,bottomLeft:0,bottomRight:0},borderSkipped:false,borderWidth:0,stack:'r'},
        {label:'Gap',data:st.worst.map(function(w,i){return w-st.best[i];}),backgroundColor:col+'44',borderRadius:{topLeft:0,topRight:0,bottomLeft:3,bottomRight:3},borderSkipped:false,borderWidth:0,stack:'r'}
      ]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{
        x:{stacked:true,grid:{display:false},ticks:{color:'#9A9388'}},
        y:{stacked:true,reverse:true,min:0,max:maxFleet+5,grid:GL,ticks:{stepSize:10,callback:function(v){return v>0?ord(v):'';},color:'#9A9388'}}
      },
      plugins:{legend:{display:true,labels:{color:'#9A9388',boxWidth:10,font:{size:12}}},
        tooltip:{backgroundColor:'#15263D',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,padding:8,
          callbacks:{label:function(ctx){return ctx.datasetIndex===0?' Best: '+ord(ctx.raw):' Worst: '+ord(st.best[ctx.dataIndex]+ctx.raw);}}}}}
  });

  /* Wind & Performance — dumbbell chart: ● steady ——— ○ gust */
  var perfCol=function(p){return p==='good'?'#1A7A4A':p==='ok'?'#B8860B':'#C0392B';};
  var perfColA=function(p){return p==='good'?'rgba(26,122,74,0.25)':p==='ok'?'rgba(184,134,11,0.25)':'rgba(192,57,43,0.25)';};
  var wMaxWind=windRegs.length>0?Math.max(...windRegs.map(function(w){return w.gust;}))+4:24;
  new Chart(document.getElementById(pfx+'-wind'),{
    type:'scatter',
    data:{datasets:[
      /* Steady dots — filled */
      {label:'Steady',data:windSteadyPts,
        backgroundColor:windRegs.map(function(w){return perfCol(w.perf);}),
        borderColor:'#fff',borderWidth:2,pointRadius:8,pointHoverRadius:11,
        pointStyle:'circle',order:1},
      /* Gust dots — ring only */
      {label:'Gust',data:windGustPts,
        backgroundColor:windRegs.map(function(w){return perfColA(w.perf);}),
        borderColor:windRegs.map(function(w){return perfCol(w.perf);}),
        borderWidth:2.5,pointRadius:7,pointHoverRadius:10,
        pointStyle:'circle',order:2}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{
        x:{min:0,max:wMaxWind,grid:GL,
          title:{display:true,text:'Wind speed (knots)',color:'#9A9388',font:{size:11}},
          ticks:{stepSize:4,color:'#9A9388'}},
        y:{min:0,max:100,grid:GL,
          title:{display:true,text:'Fleet percentile',color:'#9A9388',font:{size:11}},
          ticks:{stepSize:20,callback:function(v){return v+'%';},color:'#9A9388'}}
      },
      plugins:{legend:{display:true,position:'top',align:'end',
        labels:{color:'#9A9388',boxWidth:10,usePointStyle:true,pointStyle:'circle',font:{size:11}}},
        tooltip:{backgroundColor:'#15263D',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,padding:10,
          callbacks:{
            title:function(ctx){return windRegs[ctx[0].dataIndex].name;},
            label:function(ctx){
              var w=windRegs[ctx.dataIndex];
              if(ctx.datasetIndex===0) return[' Steady: '+w.steady+'kn',' Avg race score: '+w.pct+'% ('+w.raceCount+' race'+(w.raceCount>1?'s':'')+')'];
              return[' Gusts: '+w.gust+'kn',' Direction: '+w.dir];
            }
          }}}
    },
    plugins:[
      /* Draw dumbbell connector lines between steady and gust */
      {id:'dbell',beforeDatasetsDraw:function(chart){
        var{ctx,chartArea:ca,scales:{x,y}}=chart;if(!ca)return;
        ctx.save();
        windRegs.forEach(function(w,i){
          var xS=x.getPixelForValue(w.steady),xG=x.getPixelForValue(w.gust);
          var yy=y.getPixelForValue(w.pct);
          ctx.strokeStyle=perfCol(w.perf);ctx.lineWidth=2.5;ctx.globalAlpha=0.4;
          ctx.beginPath();ctx.moveTo(xS,yy);ctx.lineTo(xG,yy);ctx.stroke();
          ctx.globalAlpha=1;
        });
        ctx.restore();
      }},
      /* Wind zone backgrounds */
      {id:'wz2',beforeDraw:function(chart){
        var{ctx,chartArea:ca,scales:{x}}=chart;if(!ca)return;
        ctx.save();
        var x8=x.getPixelForValue(8),x15=x.getPixelForValue(15);
        ctx.globalAlpha=0.035;
        ctx.fillStyle='#2E7FD4';ctx.fillRect(ca.left,ca.top,x8-ca.left,ca.bottom-ca.top);
        ctx.fillStyle='#1A7A4A';ctx.fillRect(x8,ca.top,x15-x8,ca.bottom-ca.top);
        ctx.fillStyle='#C0392B';ctx.fillRect(x15,ca.top,ca.right-x15,ca.bottom-ca.top);
        ctx.globalAlpha=1;
        ctx.fillStyle='#9A9388';ctx.font='600 10px Barlow Condensed';
        ctx.fillText('LIGHT',ca.left+4,ca.bottom-6);
        ctx.fillText('MEDIUM',(x8+x15)/2-16,ca.bottom-6);
        ctx.fillText('FRESH',x15+4,ca.bottom-6);
        ctx.restore();
      }},
      /* Regatta name labels */
      {id:'wlbl2',afterDatasetsDraw:function(chart){
        var{ctx}=chart;var meta=chart.getDatasetMeta(1);/* gust points = rightmost */
        ctx.save();ctx.fillStyle='#7A7268';ctx.font='600 10px Barlow Condensed';ctx.textAlign='left';
        meta.data.forEach(function(pt,i){
          var nm=windRegs[i].name;
          if(nm.length>16)nm=nm.substring(0,16)+'\u2026';
          ctx.fillText(nm,pt.x+10,pt.y-6);
        });ctx.restore();
      }}
    ]
  });

  /* Steadiness chart — % of races within ±3 of median */
  new Chart(document.getElementById(pfx+'-consist'),{
    type:'bar',
    data:{labels:regs.map(function(_,i){return '#'+(i+1);}),
      datasets:[{data:steadyData,
        backgroundColor:steadyData.map(function(v){return v>=80?'#1A7A4A':v>=50?'#B8860B':'#C0392B';}),
        borderRadius:4,borderSkipped:false,borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{
        x:{grid:{display:false},ticks:{color:'#9A9388'}},
        y:{min:0,max:100,grid:GL,
          ticks:{stepSize:20,callback:function(v){return v+'%';},color:'#9A9388'}}
      },
      plugins:{legend:{display:false},
        tooltip:{backgroundColor:'#15263D',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,padding:8,
          callbacks:{title:function(ctx){return regs[ctx[0].dataIndex].name;},
            label:function(ctx){
              return ' '+ctx.raw+'% of races within \xb13 places of median';
            }}}
      }
    },
    plugins:[{id:'sline',afterDraw:function(chart){
      var{ctx,chartArea:ca,scales:{y}}=chart;if(!ca)return;
      ctx.save();ctx.strokeStyle='rgba(26,122,74,0.5)';ctx.setLineDash([4,3]);ctx.lineWidth=1.5;
      var yy=y.getPixelForValue(80);
      ctx.beginPath();ctx.moveTo(ca.left,yy);ctx.lineTo(ca.right,yy);ctx.stroke();
      ctx.setLineDash([]);ctx.fillStyle='#1A7A4A';ctx.font='600 10px Barlow Condensed';
      ctx.fillText('STEADY',ca.right-42,yy-4);
      ctx.restore();
    }},{id:'spct',afterDatasetsDraw:function(chart){
      var{ctx}=chart;var meta=chart.getDatasetMeta(0);ctx.save();
      ctx.fillStyle='#fff';ctx.font='700 12px Barlow Condensed';ctx.textAlign='center';
      meta.data.forEach(function(bar,i){
        if(steadyData[i]>15)ctx.fillText(steadyData[i]+'%',bar.x,(bar.y+bar.base)/2+5);
      });ctx.restore();
    }}]
  });

  /* Discard Analysis — which race number gets discarded */
  new Chart(document.getElementById(pfx+'-discard'),{
    type:'bar',
    data:{labels:discRaceLabels,datasets:[{data:discRaceCounts,
      backgroundColor:col,borderRadius:4,borderSkipped:false,borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{
        x:{grid:{display:false},ticks:{color:'#9A9388',font:{size:13,weight:600}}},
        y:{beginAtZero:true,grid:GL,ticks:{stepSize:1,color:'#9A9388',callback:function(v){return Number.isInteger(v)?v:'';}}}
      },
      plugins:{legend:{display:false},
        tooltip:{backgroundColor:'#15263D',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,padding:8,
          callbacks:{label:function(ctx){return ' Discarded '+ctx.raw+' time'+(ctx.raw!==1?'s':'');}}}
      }
    },
    plugins:[{id:'dtot2',afterDraw:function(chart){
      var{ctx,chartArea:ca}=chart;ctx.save();
      ctx.fillStyle='#7A7268';ctx.font='600 12px Barlow Condensed';ctx.textAlign='right';
      ctx.fillText(discTotal+' discard'+(discTotal!==1?'s':'')+' across '+regs.length+' regattas',ca.right-4,ca.top+12);
      ctx.restore();
    }},{id:'dcnt',afterDatasetsDraw:function(chart){
      var{ctx}=chart;var meta=chart.getDatasetMeta(0);ctx.save();
      ctx.fillStyle='#fff';ctx.font='700 13px Barlow Condensed';ctx.textAlign='center';
      meta.data.forEach(function(bar,i){
        if(discRaceCounts[i]>0)ctx.fillText(discRaceCounts[i],(bar.x),(bar.y+bar.base)/2+5);
      });ctx.restore();
    }}]
  });

  /* Girls trend — use Belgian girls if available, otherwise international */
  var gtData=hbg?bgR:gR;
  var gtIsBel=hbg;
  var gtMax=gtIsBel?Math.max(...bgR.map(function(r){return r.belgianGirlsTotal;})):mxGT;
  if(gtData.length>0){
    requestAnimationFrame(function(){
      var el=document.getElementById(gcId);if(!el)return;
      new Chart(el,{
        type:'line',
        data:{labels:gtData.map(function(r){return r.name.length>12?r.name.substring(0,12)+'\u2026':r.name;}),
          datasets:[{data:gtData.map(function(r){return gtIsBel?r.belgianGirlsPos:r.girlsPos;}),
            borderColor:'#B8860B',backgroundColor:'rgba(184,134,11,0.06)',
            pointBackgroundColor:gtData.map(function(r){var p=gtIsBel?r.belgianGirlsPos:r.girlsPos;return p<=3?'#B8860B':'#1A5FAB';}),
            pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:7,pointHoverRadius:10,
            borderWidth:2,tension:.3,fill:true}]},
        options:{responsive:true,maintainAspectRatio:false,
          scales:{
            x:{grid:{display:false},ticks:{color:'#9A9388',font:{size:12}}},
            y:{reverse:true,min:0,max:gtMax+2,grid:GL,
              ticks:{stepSize:Math.max(1,Math.round(gtMax/6)),callback:function(v){return v>0?ord(v):'';},color:'#9A9388'},
              title:{display:true,text:(gtIsBel?'Belgian girls position':'Girls position'),color:'#9A9388',font:{size:11}}}
          },
          plugins:{legend:{display:false},
            tooltip:{backgroundColor:'#15263D',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,padding:8,
              callbacks:{label:function(ctx){
                var r=gtData[ctx.dataIndex];
                var tot=gtIsBel?r.belgianGirlsTotal:r.girlsTotal;
                return ' '+ord(ctx.raw)+' of '+tot+(gtIsBel?' Belgian':'')+' girls';
              }}}}},
        plugins:[girlsGoalPlugin(gtMax),{id:'t3',beforeDatasetsDraw:function(chart){
          var{ctx,chartArea:ca,scales:{y}}=chart;if(!ca)return;
          var yy=y.getPixelForValue(3.5);ctx.save();
          ctx.strokeStyle='rgba(184,134,11,0.5)';ctx.setLineDash([4,3]);ctx.lineWidth=1.5;
          ctx.beginPath();ctx.moveTo(ca.left,yy);ctx.lineTo(ca.right,yy);ctx.stroke();
          ctx.setLineDash([]);ctx.fillStyle='#B8860B';ctx.font='600 11px Barlow Condensed';
          ctx.fillText('Top 3 target',ca.right-76,yy-4);ctx.restore();
        }}]
      });
    });
  }
}

/* ── UI functions ── */
function toggleReg(pfx,idx,hdr){
  var g=document.getElementById(pfx+'-rb-'+idx);
  var open=g.classList.toggle('open');
  hdr.classList.toggle('open',open);
}

var _activeSailor='mette';
var _activeSeasons={'mette':null,'stella':null};

function showSailor(key){
  _activeSailor=key;
  ['mette','stella'].forEach(function(k){
    document.getElementById('p-'+k).classList.toggle('active',k===key);
    document.querySelector('.'+(k==='mette'?'m':'s')+'-tab').classList.toggle('active',k===key);
  });
  updateSeasonBar(key);
}

function updateSeasonBar(key){
  var sailor=key==='mette'?'Mette':'Stella';
  var sailorData=D[sailor];
  if(!sailorData)return;
  var seasons=Object.keys(sailorData).sort();
  var active=_activeSeasons[key]||seasons[seasons.length-1];
  _activeSeasons[key]=active;

  var bar=document.getElementById('season-bar');
  bar.innerHTML='<span class="season-label">Season</span>'
    +seasons.map(function(s){
      return '<button onclick="switchSeason(\''+key+'\',\''+s+'\')" class="season-pill'+(s===active?' active':'')+'" id="spill-'+key+'-'+s+'">'+s+'</button>';
    }).join('')
    +'<span class="season-meta" id="season-meta"></span>';
  updateSeasonMeta(key,active,sailorData[active]);
}

function updateSeasonMeta(key,season,regs){
  var meta=document.getElementById('season-meta');
  if(!meta||!regs)return;
  meta.textContent=regs.length+' regattas &bull; '+regs.reduce(function(a,r){return a+r.races.length;},0)+' races';
  meta.innerHTML=regs.length+' regattas &bull; '+regs.reduce(function(a,r){return a+r.races.length;},0)+' races';
}

function switchSeason(key,seasonKey){
  _activeSeasons[key]=seasonKey;
  var sailor=key==='mette'?'Mette':'Stella';
  updateSeasonBar(key);
  buildPanel(key,D[sailor],seasonKey);
  updateSeasonMeta(key,seasonKey,D[sailor][seasonKey]);
}

/* ── Init ── */
if(D&&D.Mette) buildPanel('mette',D.Mette,null);
if(D&&D.Stella)buildPanel('stella',D.Stella,null);
showSailor('mette');
document.getElementById('upd-time').textContent='Updated: 27 Apr 2026 at 14:45';
document.getElementById('footer-upd').textContent='Updated: 27 Apr 2026 at 14:45';
</script>
